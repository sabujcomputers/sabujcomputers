const navs=[['dashboard','📊','Dashboard'],['tasks','✅','দৈনিক কাজ'],['prompts','⚡','Prompt Center'],['notes','📝','নোটস'],['customers','👥','Customer Profile'],['dues','💰','বাকি / আদায়'],['finance','💵','Income / Expense'],['stock','📦','Stock'],['reports','📈','Reports'],['templates','📋','Templates'],['backup','🔐','Backup'],['settings','⚙️','Settings']];
function showApp(){$('auth').classList.add('hide');$('app').classList.remove('hide');$('nav').innerHTML=navs.map((n,i)=>`<button class="${i?'':'active'}" onclick="go('${n[0]}',this)">${n[1]} <span>${n[2]}</span></button>`).join('');go('dashboard',$('nav').firstElementChild)}function go(id,b){document.querySelectorAll('#nav button').forEach(x=>x.classList.remove('active'));b?.classList.add('active');document.querySelectorAll('.view').forEach(x=>x.classList.remove('on'));$(id).classList.add('on');$('ttl').textContent=navs.find(x=>x[0]===id)?.[2]||id;render(id)}function renderAll(){if(!$('app').classList.contains('hide'))render(document.querySelector('.view.on')?.id||'dashboard')}function render(id){({dashboard:renderDash,tasks:renderTasks,prompts:renderPrompts,notes:renderNotes,customers:renderCustomers,dues:renderDues,finance:renderFinance,stock:renderStock,reports:renderReports,templates:renderTemplates,backup:renderBackup,settings:renderSettings}[id]||renderDash)()}

function renderNotes(){ $('notes').innerHTML=`<div class="card"><button class="btn g" onclick="newNote()">＋ নোট</button><div class="list" style="margin-top:10px">${data.notes.map(n=>`<div class="row"><div><b>${esc(n.title)}</b><small>${esc(n.text)}</small></div><button class="btn r" onclick="remove('notes','${n.id}')">Delete</button></div>`).join('')||'<div class="empty">নোট নেই</div>'}</div></div>`}
function renderCustomers(){ $('customers').innerHTML=`<div class="card"><button class="btn g" onclick="newCustomer()">＋ কাস্টমার</button><div class="list" style="margin-top:10px">${data.customers.map(c=>{let ds=customerDues(c),left=ds.reduce((s,d)=>s+d.left,0);return `<div class="row"><div><b>${esc(c.name)}</b><small>${esc(c.phone||'')} • ${esc(c.address||'')} • বাকি ${money(left)}</small></div><div class="ra"><button class="btn b" onclick="customerView('${c.id}')">Profile</button><button class="btn r" onclick="remove('customers','${c.id}')">Delete</button></div></div>`}).join('')||'<div class="empty">কাস্টমার নেই</div>'}</div></div>`}
function renderDues(){let all=data.dues.map(d=>({...d,left:Math.max(0,Number(d.amount||0)-Number(d.paid||0))})).filter(d=>d.left>0);$('dues').innerHTML=`<div class="card"><div class="actions"><button class="btn g" onclick="quickDue()">＋ নতুন বাকি</button></div><div class="list" style="margin-top:10px">${all.map(d=>`<div class="row"><div><b>${esc(d.customer)}</b><small>মোট ${money(d.amount)} • Paid ${money(d.paid)} • বাকি ${money(d.left)} • Due ${d.payDate||'নেই'}</small></div><div class="ra">${d.phone?`<button class="btn l" onclick="call('${esc(d.phone)}')">📞</button><button class="btn l" onclick="wa('${d.id}')">💬</button>`:''}<button class="btn g" onclick="payDue('${d.id}')">💳 আদায়</button><button class="btn b" onclick="receipt('${d.id}')">🧾</button><button class="btn r" onclick="remove('dues','${d.id}')">Delete</button></div></div>`).join('')||'<div class="empty">কোনো বাকি নেই</div>'}</div></div>`}

function renderReports(){let inc=monthSum('income'),out=monthSum('expense'),collection=data.dues.reduce((s,d)=>s+Number(d.paid||0),0),due=data.dues.reduce((s,d)=>s+Math.max(0,Number(d.amount||0)-Number(d.paid||0)),0);$('reports').innerHTML=`<div class="progrid"><div class="prostat">💵<b>${money(inc)}</b>মাসিক আয়</div><div class="prostat">💸<b>${money(out)}</b>মাসিক খরচ</div><div class="prostat">💳<b>${money(collection)}</b>মোট আদায়</div><div class="prostat">⏳<b>${money(due)}</b>বর্তমান বাকি</div></div><div class="card"><h2>📊 Summary</h2><p>নিট আয়: <b>${money(inc-out)}</b></p><p>কাস্টমার: <b>${data.customers.length}</b> | পণ্য: <b>${data.stock.length}</b> | কাজ: <b>${data.tasks.length}</b></p><button class="btn b" onclick="window.print()">🖨️ Print Report</button></div>`}
function renderTemplates(){let ts=[['NID','NID Download / Print / Lamination','NID ডাউনলোড + প্রিন্ট + লেমিনেট'],['Job Application','চাকরির আবেদনপত্র','নাম, ঠিকানা, পদ ও প্রতিষ্ঠানের তথ্য দিয়ে আবেদনপত্র তৈরি'],['Passport Photo','Passport Photo','ছবির background, size ও print setup-এর checklist'],['CV','Professional CV','ATS-friendly CV তৈরির তথ্য checklist']];$('templates').innerHTML=`<div class="grid">${ts.map(x=>`<div class="template"><h3>${x[0]}</h3><p class="muted">${x[1]}</p><button class="btn b" onclick="copy('${esc(x[2])}')">Copy Template</button></div>`).join('')}</div>`}function renderBackup(){$('backup').innerHTML=`<div class="card"><h2>🔐 Data Safety Center</h2><p class="muted">এই account-এর loaded data JSON হিসেবে backup/restore করা যাবে।</p><div class="actions"><button class="btn g" onclick="backup()">⬇️ Backup Download</button><button class="btn l" onclick="restore()">⬆️ Restore Backup</button></div></div>`}function renderSettings(){$('settings').innerHTML=`<div class="card"><h2>Settings</h2><p>Login: <b>${esc(me?.email||'')}</b></p><p class="muted">Supabase Cloud connected • Bangladesh date: ${today()}</p><button class="btn r" onclick="out()">Logout</button></div>`}
function monthSum(type){let ym=today().slice(0,7);return data.finance.filter(x=>x.type===type&&String(x.date||'').startsWith(ym)).reduce((s,x)=>s+Number(x.amount||0),0)}function dueAlerts(){let t=today(),dt=new Date(t+'T00:00:00');dt.setDate(dt.getDate()+1);let td=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Dhaka'}).format(dt);return data.dues.map(d=>({...d,left:Math.max(0,Number(d.amount||0)-Number(d.paid||0))})).filter(d=>d.left>0).map(d=>({...d,state:d.payDate&&d.payDate<t?'মেয়াদ শেষ':d.payDate===td?'আগামীকাল':''})).filter(d=>d.state)}function customerDues(c){return data.dues.map(d=>({...d,left:Math.max(0,Number(d.amount||0)-Number(d.paid||0))})).filter(d=>d.left>0&&((c.phone&&d.phone===c.phone)||(c.name&&d.customer===c.name)))}
function openModal(title,body,m,id=null){mode=m;editing=id;$('mh').textContent=title;$('mb').innerHTML=body;$('modal').classList.add('on')}function closeModal(){$('modal').classList.remove('on');mode=null;editing=null}function quickTask(){openModal('নতুন কাজ',`<div class="field"><label>কাজ</label><input id="f1"></div><div class="formgrid"><div class="field"><label>তারিখ</label><input id="f2" type="date" value="${today()}"></div><div class="field"><label>Priority</label><select id="f3"><option>High</option><option selected>Medium</option><option>Low</option></select></div></div><div class="field"><label>নোট</label><textarea id="f4"></textarea></div>`,'task')}function quickDue(){openModal('নতুন বাকি',`<div class="formgrid"><div class="field"><label>কাস্টমার</label><input id="f1"></div><div class="field"><label>ফোন</label><input id="f2"></div><div class="field"><label>মোট টাকা</label><input id="f3" type="number"></div><div class="field"><label>Due Date</label><input id="f4" type="date" value="${today()}"></div></div><div class="field"><label>নোট</label><textarea id="f5"></textarea></div>`,'due')}function newPrompt(){openModal('নতুন Prompt',`<div class="field"><label>নাম</label><input id="f1"></div><div class="field"><label>Category</label><input id="f2" value="General"></div><div class="field"><label>Prompt</label><textarea id="f3"></textarea></div>`,'prompt')}function newNote(){openModal('নতুন নোট',`<div class="field"><label>শিরোনাম</label><input id="f1"></div><div class="field"><label>নোট</label><textarea id="f2"></textarea></div>`,'note')}function newCustomer(){openModal('নতুন কাস্টমার',`<div class="formgrid"><div class="field"><label>নাম</label><input id="f1"></div><div class="field"><label>ফোন</label><input id="f2"></div><div class="field full"><label>ঠিকানা</label><input id="f3"></div></div>`,'customer')}function newFinance(){openModal('নতুন লেনদেন',`<div class="formgrid"><div class="field"><label>Type</label><select id="f1"><option value="income">Income</option><option value="expense">Expense</option></select></div><div class="field"><label>Date</label><input id="f2" type="date" value="${today()}"></div><div class="field full"><label>Amount</label><input id="f3" type="number"></div><div class="field full"><label>Note</label><input id="f4"></div></div>`,'finance')}function newStock(){openModal('নতুন পণ্য',`<div class="formgrid"><div class="field"><label>পণ্য</label><input id="f1"></div><div class="field"><label>Unit</label><input id="f2" value="pcs"></div><div class="field"><label>Quantity</label><input id="f3" type="number" value="0"></div><div class="field"><label>Minimum</label><input id="f4" type="number" value="5"></div></div>`,'stock')}
async function saveModal(){let o=null,t=mode;if(t==='task'){o={title:$('f1').value.trim(),date:$('f2').value||today(),priority:$('f3').value,note:$('f4').value,done:false};if(!o.title)return toast('কাজের নাম দিন')}if(t==='due'){o={customer:$('f1').value.trim(),phone:$('f2').value.trim(),amount:Number($('f3').value||0),payDate:$('f4').value||today(),note:$('f5').value,paid:0,history:[]};if(!o.customer||!o.amount)return toast('কাস্টমার ও টাকা দিন')}if(t==='prompt'){o={title:$('f1').value.trim(),category:$('f2').value||'General',text:$('f3').value,favorite:false};if(!o.title||!o.text)return toast('নাম ও prompt দিন')}if(t==='note'){o={title:$('f1').value.trim(),text:$('f2').value};if(!o.title)return toast('শিরোনাম দিন')}if(t==='customer'){o={name:$('f1').value.trim(),phone:$('f2').value.trim(),address:$('f3').value.trim()};if(!o.name)return toast('নাম দিন')}if(t==='finance'){o={type:$('f1').value,date:$('f2').value||today(),amount:Number($('f3').value||0),note:$('f4').value};if(!o.amount)return toast('টাকা দিন')}if(t==='stock'){o={name:$('f1').value.trim(),unit:$('f2').value||'pcs',qty:Number($('f3').value||0),min:Number($('f4').value||0)};if(!o.name)return toast('পণ্যের নাম দিন')}let k=t==='task'?'tasks':t==='due'?'dues':t==='prompt'?'prompts':t==='note'?'notes':t==='customer'?'customers':t;if(await save(k,o,editing)){closeModal();renderAll()}}
async function toggleTask(id){let x=data.tasks.find(a=>a.id===id);if(x){x.done=!x.done;await save('tasks',x,id);renderAll()}}async function favPrompt(id){let x=data.prompts.find(a=>a.id===id);if(x){x.favorite=!x.favorite;await save('prompts',x,id);renderAll()}}async function payDue(id){let d=data.dues.find(x=>x.id===id);if(!d)return;let n=Number(prompt(`বাকি ${money(Number(d.amount||0)-Number(d.paid||0))}. কত টাকা আদায়?`)||0);if(!n||n<0)return;d.paid=Number(d.paid||0)+n;d.history=d.history||[];d.history.push({amount:n,date:today()});await save('dues',d,id);renderAll()}function customerView(id){let c=data.customers.find(x=>x.id===id),ds=customerDues(c),hist=ds.flatMap(d=>d.history||[]);alert(`${c.name}\nফোন: ${c.phone||''}\nঠিকানা: ${c.address||''}\nবর্তমান বাকি: ${money(ds.reduce((s,d)=>s+d.left,0))}\nPayment history: ${hist.length}`)}function adjustStock(id){let x=data.stock.find(a=>a.id===id),n=Number(prompt(`বর্তমান ${x.qty}. কত যোগ/বিয়োগ করবেন?`)||0);if(n===0)return;x.qty=Number(x.qty||0)+n;save('stock',x,id).then(renderAll)}function call(p){location.href='tel:'+p}function wa(id){let d=data.dues.find(x=>x.id===id);if(!d?.phone)return;let msg=`আসসালামু আলাইকুম ${d.customer||''}, আপনার বাকি টাকা ${money(Number(d.amount||0)-Number(d.paid||0))}। অনুগ্রহ করে সুবিধামতো পরিশোধ করবেন। ধন্যবাদ — সবুজ কম্পিউটার্স`;window.open('https://wa.me/'+String(d.phone).replace(/\D/g,'')+'?text='+encodeURIComponent(msg),'_blank')}function copy(s){navigator.clipboard?.writeText(s);toast('Copied')}function copyText(id){let p=data.prompts.find(x=>x.id===id);if(p)copy(p.text)}function receipt(id){let d=data.dues.find(x=>x.id===id);if(!d)return;let last=(d.history||[]).at(-1),w=window.open('','_blank');w.document.write(`<html><body style="font-family:Arial;padding:30px"><h2>সবুজ কম্পিউটার্স</h2><h3>Payment Receipt</h3><p>Customer: ${esc(d.customer)}</p><p>Date: ${last?.date||today()}</p><p>Payment: ${money(last?.amount||d.paid)}</p><p>Total: ${money(d.amount)}</p><p>Paid: ${money(d.paid)}</p><p>Due: ${money(Number(d.amount||0)-Number(d.paid||0))}</p><script>window.print()<\/script></body></html>`);w.document.close()}function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='sabuj-workdesk-backup-'+today()+'.json';a.click()}function restore(){let i=document.createElement('input');i.type='file';i.accept='.json';i.onchange=async()=>{let f=i.files[0];if(!f)return;try{let x=JSON.parse(await f.text());for(const t of Object.keys(data))for(const r of (x[t]||[]))await save(t,r,r.id);await load();toast('Restore complete')}catch(e){toast('Invalid backup')}};i.click()}
(async()=>{let s=await db.auth.getSession();if(s.data.session){me=s.data.session.user;await load();showApp()}})();
</script></body></html>
