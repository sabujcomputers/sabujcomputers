te-columns:1fr}.full{grid-column:auto}.stats{grid-template-columns:1fr 1fr}header{align-items:flex-start}.row{align-items:flex-start;flex-direction:column}}</style></head><body><div id="auth" class="auth"><div class="box"><h1>🟩 সবুজ কম্পিউটার্স</h1><p class="muted">Smart Work Desk Pro — Cloud Login</p><div class="field"><label>Email</label><input id="em" type="email"></div><div class="field"><label>Password</label><input id="pw" type="password"></div><button class="btn g" onclick="login()">Login</button> <button class="btn l" onclick="signup()">নতুন Account</button></div></div><div id="app" class="app hide"><aside><h2>🟩<span> সবুজ কম্পিউটার্স</span></h2><nav id="nav"></nav></aside><main><header><div><h1 id="ttl">Dashboard</h1><div class="muted">দৈনিক কাজ, কাস্টমার, বাকি, আয়-খরচ, স্টক ও রিপোর্ট</div></div><div class="actions"><button class="btn l" onclick="openTask()">＋ কাজ</button><button class="btn g" onclick="openDue()">＋ বাকি</button></div></header><section id="dashboard" class="view on"></section><section id="tasks" class="view"></section><section id="prompts" class="view"></section><section id="notes" class="view"></section><section id="customers" class="view"></section><section id="dues" class="view"></section><section id="finance" class="view"></section><section id="stock" class="view"></section><section id="reports" class="view"></section><section id="templates" class="view"></section><section id="backup" class="view"></section><section id="settings" class="view"></section></main></div><div id="modal" class="modal"><div class="box"><div style="display:flex;justify-content:space-between;align-items:center"><h2 id="mh">নতুন</h2><button class="btn l" onclick="closeModal()">✕</button></div><div id="mb"></div><div style="text-align:right;margin-top:12px"><button class="btn l" onclick="closeModal()">Cancel</button> <button class="btn g" onclick="saveModal()">Save</button></div></div></div><div id="toast" class="toast"></div><script>

async function signup(){let r=await db.auth.signUp({email:$('em').value.trim(),password:$('pw').value});toast(r.error?r.error.message:(r.data.session?'Account তৈরি হয়েছে':'ইমেইল verify করে Login করুন'))}async function login(){let r=await db.auth.signInWithPassword({email:$('em').value.trim(),password:$('pw').value});if(r.error)return toast(r.error.message);me=r.data.user;await load();showApp()}async function out(){await db.auth.signOut();location.reload()}
async function load(){let r=await db.from('workdesk_items').select('*').eq('owner_id',me.id).order('updated_at',{ascending:false});if(r.error)return toast(r.error.message);data={tasks:[],prompts:[],notes:[],customers:[],dues:[],templates:[],finance:[],stock:[]};(r.data||[]).forEach(x=>{let t=x.item_type==='task'?'tasks':x.item_type==='prompt'?'prompts':x.item_type==='note'?'notes':x.item_type==='customer'?'customers':x.item_type==='due'?'dues':x.item_type==='template'?'templates':x.item_type==='finance'?'finance':x.item_type==='stock'?'stock':null;if(t)data[t].push({id:x.id,...(x.data||{})})});renderAll()}
async function save(t,obj,id){let rid=id||crypto.randomUUID(),r=await db.from('workdesk_items').upsert({id:rid,owner_id:me.id,item_type:t,data:obj,updated_at:new Date().toISOString()});if(r.error){toast(r.error.message);return false}let i=data[t].findIndex(x=>x.id===rid),v={id:rid,...obj};i<0?data[t].unshift(v):data[t][i]=v;return true}async function remove(t,id){if(!confirm('মুছে ফেলবেন?'))return;let r=await db.from('workdesk_items').delete().eq('id',id).eq('owner_id',me.id);if(r.error)return toast(r.error.message);data[t]=data[t].filter(x=>x.id!==id);renderAll()}
const navs=[['dashboard','📊','Dashboard'],['tasks','✅','দৈনিক কাজ'],['prompts','⚡','Prompt Center'],['notes','📝','নোটস'],['customers','👥','Customer Profile'],['dues','💰','বাকি / আদায়'],['finance','💵','Income / Expense'],['stock','📦','Stock'],['reports','📈','Reports'],['templates','📋','Templates'],['backup','🔐','Backup'],['settings','⚙️','Settings']];
function showApp(){$('auth').classList.add('hide');$('app').classList.remove('hide');$('nav').innerHTML=navs.map((n,i)=>`<button class="${i?'':'active'}" onclick="go('${n[0]}',this)">${n[1]} <span>${n[2]}</span></button>`).join('');go('dashboard',$('nav').firstElementChild)}function go(id,b){document.querySelectorAll('#nav button').forEach(x=>x.classList.remove('active'));b?.classList.add('active');document.querySelectorAll('.view').forEach(x=>x.classList.remove('on'));$(id).classList.add('on');$('ttl').textContent=navs.find(x=>x[0]===id)?.[2]||id;render(id)}function renderAll(){if(!$('app').classList.contains('hide'))render(document.querySelector('.view.on')?.id||'dashboard')}function render(id){({dashboard:renderDash,tasks:renderTasks,prompts:renderPrompts,notes:renderNotes,customers:renderCustomers,dues:renderDues,finance:renderFinance,stock:renderStock,reports:renderReports,templates:renderTemplates,backup:renderBackup,settings:renderSettings}[id]||renderDash)()}
function dueInfo(d){let left=Math.max(0,Number(d.amount||0)-Number(d.paid||0)),over=!!d.promiseDate&&d.promiseDate<today()&&left>0;return{left,over,state:left<=0?'পরিশোধ সম্পন্ন':over?'মেয়াদ শেষ':d.promiseDate?'পরিশোধের তারিখ: '+dateText(d.promiseDate):'তারিখ দেওয়া হয়নি'}}function dueAlerts(){return data.dues.map(d=>({...d,...dueInfo(d)})).filter(x=>x.left>0).sort((a,b)=>(b.over-a.over)||((a.promiseDate||'9999')>(b.promiseDate||'9999')?1:-1))}function totalDue(){return data.dues.reduce((s,x)=>s+dueInfo(x).left,0)}
function renderDash(){let ts=data.tasks.filter(x=>x.date===today()),pending=ts.filter(x=>!x.done).length,alerts=dueAlerts(),over=alerts.filter(x=>x.over).length,inc=monthSum('income'),out=monthSum('expense'),low=data.stock.filter(x=>Number(x.qty||0)<=Number(x.min||0)).length;$('dashboard').innerHTML=`<div class="stats"><div class="stat">📌<b>${ts.length}</b>আজকের কাজ</div><div class="stat">⏳<b>${pending}</b>Pending</div><div class="stat">💰<b>${money(totalDue())}</b>মোট বাকি</div><div class="stat">👥<b>${data.customers.length}</b>মোট কাস্টমার</div></div><div class="stats"><div class="stat">🔴<b>${over}</b>মেয়াদ শেষ</div><div class="stat">💵<b>${money(inc)}</b>এই মাসের আয়</div><div class="stat">💸<b>${money(out)}</b>এই মাসের খরচ</div><div class="stat">📦<b>${low}</b>Low Stock</div></div><div class="grid"><div class="card"><h2>আজকের কাজ</h2>${ts.map(t=>`<div class="row"><div><b>${esc(t.title)}</b><small>${esc(t.note||'')}</small></div><button class="btn ${t.done?'g':'y'}" onclick="toggleTask('${t.id}')">${t.done?'Done':'Pending'}</button></div>`).join('')||'<div class="empty">আজকের কোনো কাজ নেই</div>'}</div><div class="card"><h2>⚠️ জরুরি বাকি</h2>${alerts.slice(0,7).map(d=>dueRow(d)).join('')||'<div class="empty">জরুরি বাকি নেই</div>'}</div></div>`}
function dueRow(d){return `<div class="row ${d.over?'overdue':''}"><div><b>${esc(d.customer)}</b> ${d.over?'<span class="badge danger">মেয়াদ শেষ</span>':''}<small>${money(d.left)} • ${d.state}${d.dueDate?' • বাকি: '+dateText(d.dueDate):''}</small></div><div class="ra"><button class="btn y" onclick="payDue('${d.id}')">আদায়</button>${d.phone?`<button class="btn l" onclick="call('${esc(d.phone)}')">📞</button><button class="btn l" onclick="wa('${d.id}')">💬</button>`:''}</div></div>`}
function renderTasks(){let list=data.tasks.sort((a,b)=>(b.date||'').localeCompare(a.date||''));$('tasks').innerHTML=`<div class="card"><div class="actions" style="margin-bottom:10px"><button class="btn g" onclick="openTask()">＋ নতুন কাজ</button></div><div class="list">${list.map(t=>`<div class="row"><div><b>${esc(t.title)}</b><small>${dateText(t.date)} • ${esc(t.note||'')}</small></div><div class="ra"><button class="btn ${t.done?'g':'y'}" onclick="toggleTask('${t.id}')">${t.done?'Done':'Pending'}</button><button class="btn r" onclick="remove('tasks','${t.id}')">Delete</button></div></div>`).join('')||'<div class="empty">কাজ নেই</div>'}</div></div>`}
function renderPrompts(){let pinned=data.prompts.filter(x=>x.pinned);$('prompts').innerHTML=`<div class="card"><h2>📌 Quick-bar</h2><div class="muted">Pin করা prompt এখানে এক ট্যাপে কপি করুন</div><div class="quickbar">${pinned.map(p=>`<button class="chip" onclick="copyText(${JSON.stringify(p.text||'')})">${esc((p.title||'Prompt').slice(0,28))} 📋</button>`).join('')||'<span class="muted">এখনো কোনো prompt pin করা হয়নি</span>'}</div><div class="actions"><button class="btn g" onclick="openPrompt()">＋ নতুন Prompt</button></div></div><div class="card" style="margin-top:12px"><div class="list">${data.prompts.map(p=>`<div class="row"><div><b>${esc(p.title)}</b><small>${esc(p.text||'')}</small></div><div class="ra"><button class="btn l" onclick="copyText(${JSON.stringify(p.text||'')})">📋 Copy</button><button class="btn ${p.pinned?'g':'l'}" onclick="togglePin('${p.id}')">${p.pinned?'📌 Pinned':'📌 Pin'}</button><button class="btn r" onclick="remove('prompts','${p.id}')">Delete</button></div></div>`).join('')||'<div class="empty">Prompt নেই</div>'}</div></div>`}

function renderDues(){let a=dueAlerts(),over=a.filter(x=>x.over).length;$('dues').innerHTML=`<div class="stats"><div class="stat">💰<b>${money(totalDue())}</b>মোট বাকি</div><div class="stat">🔴<b>${over}</b>মেয়াদ শেষ</div><div class="stat">👥<b>${data.customers.length}</b>মোট কাস্টমার</div><div class="stat">🧾<b>${a.length}</b>চলতি বাকি</div></div><div class="card"><div class="actions" style="margin-bottom:10px"><button class="btn g" onclick="openDue()">＋ বাকি যোগ করুন</button><button class="btn l" onclick="openCustomer()">＋ নতুন কাস্টমার</button></div><div class="list">${a.map(d=>dueRow(d)+`<div class="muted" style="padding:0 10px 6px">${d.dueDate?'বাকি দেওয়ার তারিখ: '+dateText(d.dueDate):''}${d.promiseDate?' • বলেছে পরিশোধ করবে: '+dateText(d.promiseDate):''}</div>`).join('')||'<div class="empty">কোনো বাকি নেই</div>'}</div></div>`}

function monthSum(type){let m=today().slice(0,7);return data.finance.filter(x=>x.type===type&&(x.date||'').startsWith(m)).reduce((s,x)=>s+Number(x.amount||0),0)}function renderReports(){$('reports').innerHTML=`<div class="stats"><div class="stat">💵<b>${money(monthSum('income'))}</b>মাসিক আয়</div><div class="stat">💸<b>${money(monthSum('expense'))}</b>মাসিক খরচ</div><div class="stat">📈<b>${money(monthSum('income')-monthSum('expense'))}</b>নিট</div><div class="stat">💰<b>${money(totalDue())}</b>বকেয়া</div></div><div class="card"><h2>বাকি তালিকা</h2><div class="tablewrap"><table class="tbl"><tr><th>কাস্টমার</th><th>বাকি</th><th>বাকি তারিখ</th><th>পরিশোধের প্রতিশ্রুতি</th><th>স্ট্যাটাস</th></tr>${dueAlerts().map(d=>`<tr><td>${esc(d.customer)}</td><td>${money(d.left)}</td><td>${dateText(d.dueDate)}</td><td>${dateText(d.promiseDate)}</td><td>${d.over?'<span class="badge danger">মেয়াদ শেষ</span>':'<span class="badge good">চলতি</span>'}</td></tr>`).join('')}</table></div></div>`}

function openModal(title,body,m){mode=m;editing=null;$('mh').textContent=title;$('mb').innerHTML=body;$('modal').classList.add('on')}function closeModal(){$('modal').classList.remove('on');mode=null;editing=null}
function openTask(){openModal('নতুন কাজ',`<div class="formgrid"><div class="field"><label>কাজ</label><input id="f_title"></div><div class="field"><label>তারিখ</label><input id="f_date" type="date" value="${today()}"></div><div class="field full"><label>নোট</label><textarea id="f_note"></textarea></div></div>`,'task')}
function openPrompt(){openModal('নতুন Prompt',`<div class="field"><label>শিরোনাম</label><input id="f_title"></div><div class="field"><label>Prompt</label><textarea id="f_text"></textarea></div><label><input id="f_pin" type="checkbox" style="width:auto"> 📌 Quick-bar এ Pin করুন</label>`,'prompt')}
function openNote(){openModal('নতুন নোট',`<div class="field"><label>শিরোনাম</label><input id="f_title"></div><div class="field"><label>নোট</label><textarea id="f_text"></textarea></div>`,'note')}
function dueFields(){return `<div class="field"><label>কাস্টমারের নাম *</label><input id="f_customer"></div><div class="field"><label>ফোন নম্বর</label><input id="f_phone" type="tel"></div><div class="field"><label>বাকি টাকা *</label><input id="f_amount" type="number" min="0"></div><div class="field"><label>বাকি দেওয়ার তারিখ *</label><input id="f_dueDate" type="date" value="${today()}"><small class="muted">পুরনো হিসাব হলে আগের তারিখ দিন</small></div><div class="field"><label>কবে পরিশোধ করবে বলেছে (ঐচ্ছিক)</label><input id="f_promiseDate" type="date"><small class="muted">এই তারিখ পার হলে কাস্টমার উপরে উঠে “মেয়াদ শেষ” দেখাবে</small></div><div class="field"><label>ঠিকানা</label><input id="f_address"></div><div class="field full"><label>নোট/বিবরণ</label><textarea id="f_note"></textarea></div>`}function openDue(){openModal('বাকি যোগ করুন',dueFields(),'due')}function openCustomer(){openModal('নতুন কাস্টমার + বাকি',`<div class="formgrid"><div class="field"><label>কাস্টমারের নাম *</label><input id="f_customer"></div><div class="field"><label>ফোন নম্বর</label><input id="f_phone" type="tel"></div><div class="field"><label>ঠিকানা</label><input id="f_address"></div><div class="field"><label>বাকি টাকা (না থাকলে 0)</label><input id="f_amount" type="number" min="0" value="0"></div><div class="field"><label>বাকি দেওয়ার তারিখ</label><input id="f_dueDate" type="date" value="${today()}"></div><div class="field"><label>কবে পরিশোধ করবে বলেছে (ঐচ্ছিক)</label><input id="f_promiseDate" type="date"></div><div class="field full"><label>নোট</label><textarea id="f_note"></textarea></div></div>`,'customer')}
function openFinance(){openModal('আয় / খরচ',`<div class="formgrid"><div class="field"><label>ধরন</label><select id="f_type"><option value="income">আয়</option><option value="expense">খরচ</option></select></div><div class="field"><label>টাকা</label><input id="f_amount" type="number" min="0"></div><div class="field"><label>তারিখ</label><input id="f_date" type="date" value="${today()}"></div><div class="field"><label>বিবরণ</label><input id="f_note"></div></div>`,'finance')}function openStock(){openModal('Stock Item',`<div class="formgrid"><div class="field"><label>পণ্যের নাম</label><input id="f_name"></div><div class="field"><label>Quantity</label><input id="f_qty" type="number"></div><div class="field"><label>Minimum</label><input id="f_min" type="number" value="0"></div><div class="field"><label>Price</label><input id="f_price" type="number"></div></div>`,'stock')}
async function saveModal(){let ok=false;if(mode==='task'){if(!$('f_title').value.trim())return toast('কাজের নাম দিন');ok=await save('tasks',{title:$('f_title').value.trim(),date:$('f_date').value,note:$('f_note').value,done:false})}else if(mode==='prompt'){if(!$('f_title').value.trim()||!$('f_text').value.trim())return toast('শিরোনাম ও Prompt দিন');ok=await save('prompts',{title:$('f_title').value.trim(),text:$('f_text').value,pinned:$('f_pin').checked})}else if(mode==='note'){ok=await save('notes',{title:$('f_title').value.trim(),text:$('f_text').value})}else if(mode==='due'||mode==='customer'){let name=$('f_customer').value.trim(),amt=Number($('f_amount').value||0);if(!name|| (mode==='due'&&amt<=0))return toast('নাম ও বাকি টাকার পরিমাণ দিন');let customerId=null;if(mode==='customer'){customerId=crypto.randomUUID();let c={id:customerId,name,phone:$('f_phone').value.trim(),address:$('f_address').value.trim(),note:$('f_note').value};let cr=await save('customers',c,customerId);if(!cr)return; if(amt>0)ok=await save('dues',{customer:name,customerId,phone:c.phone,address:c.address,amount:amt,paid:0,dueDate:$('f_dueDate').value,promiseDate:$('f_promiseDate').value,note:c.note,history:[]});else ok=true}else{ok=await save('dues',{customer:name,phone:$('f_phone').value.trim(),address:$('f_address').value.trim(),amount:amt,paid:0,dueDate:$('f_dueDate').value,promiseDate:$('f_promiseDate').value,note:$('f_note').value,history:[]})}}else if(mode==='finance'){ok=await save('finance',{type:$('f_type').value,amount:Number($('f_amount').value||0),date:$('f_date').value,note:$('f_note').value})}else if(mode==='stock'){ok=await save('stock',{name:$('f_name').value.trim(),qty:Number($('f_qty').value||0),min:Number($('f_min').value||0),price:Number($('f_price').value||0)})}if(ok){closeModal();renderAll();toast('সংরক্ষণ হয়েছে')}}
async function payDue(id){let d=data.dues.find(x=>x.id===id);if(!d)return;let left=dueInfo(d).left;if(left<=0)return toast('এই বাকি পরিশোধ সম্পন্ন');let v=prompt('কত টাকা পরিশোধ করেছে?\nবাকি: '+left);if(v===null)return;let n=Number(v);if(!n||n<0||n>left)return toast('সঠিক পরিমাণ দিন');d.paid=Number(d.paid||0)+n;d.history=[...(d.history||[]),{date:today(),amount:n}];if(await save('dues',d,d.id)){renderAll();toast('পেমেন্ট সংরক্ষণ হয়েছে')}}
function toggleTask(id){let t=data.tasks.find(x=>x.id===id);if(!t)return;t.done=!t.done;save('tasks',t,id).then(renderAll)}function togglePin(id){let p=data.prompts.find(x=>x.id===id);if(!p)return;p.pinned=!p.pinned;save('prompts',p,id).then(renderAll)}async function copyText(t){try{await navigator.clipboard.writeText(t);toast('কপি হয়েছে')}catch(e){toast('Copy করা যায়নি')}}function call(p){location.href='tel:'+String(p).replace(/[^0-9+]/g,'')}function wa(id){let d=data.dues.find(x=>x.id===id);if(!d?.phone)return;let left=dueInfo(d).left,msg=`আসসালামু আলাইকুম ${d.customer}, আপনার কাছে আমাদের ${left} টাকা বাকি আছে। অনুগ্রহ করে সুবিধামতো পরিশোধ করবেন। ধন্যবাদ — সবুজ কম্পিউটার্স।`;window.open('https://wa.me/'+String(d.phone).replace(/\D/g,'')+'?text='+encodeURIComponent(msg),'_blank')}function waCustomer(id){let c=data.customers.find(x=>x.id===id);if(!c?.phone)return;let d=data.dues.find(x=>x.customerId===id||x.customer===c.name),left=d?dueInfo(d).left:0,msg=`আসসালামু আলাইকুম ${c.name}, আপনার কাছে আমাদের ${left} টাকা বাকি আছে। অনুগ্রহ করে সুবিধামতো পরিশোধ করবেন। ধন্যবাদ — সবুজ কম্পিউটার্স।`;window.open('https://wa.me/'+String(c.phone).replace(/\D/g,'')+'?text='+encodeURIComponent(msg),'_blank')}
function backup(){let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='sabuj-computers-backup-'+today()+'.json';a.click();URL.revokeObjectURL(a.href)}async function restore(file){if(!file)return;try{let x=JSON.parse(await file.text());for(let t of Object.keys(data)){for(let o of (x[t]||[])){let copy={...o};delete copy.id;await save(t,copy)}}await load();toast('Restore সম্পন্ন')}catch(e){toast('Backup file সঠিক নয়')}}
db.auth.getSession().then(async r=>{if(r.data.session){me=r.data.session.user;await load();showApp()}});
</script></body></html>
