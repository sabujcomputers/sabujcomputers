<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sabuj Computers — Cloud Work Desk</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:Arial,sans-serif;margin:0;background:#f4f7f6;color:#17324d}header{background:#083e28;color:white;padding:16px 20px;display:flex;justify-content:space-between;align-items:center}main{max-width:1100px;margin:20px auto;padding:0 15px}.card{background:white;border:1px solid #ddd;border-radius:12px;padding:16px;margin-bottom:16px}button{border:0;border-radius:8px;padding:9px 13px;cursor:pointer;background:#079447;color:white;font-weight:bold}button.red{background:#d83a3a}input,textarea,select{width:100%;box-sizing:border-box;padding:10px;border:1px solid #ccc;border-radius:8px;margin:5px 0 10px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}.item{border:1px solid #ddd;border-radius:10px;padding:12px;margin:8px 0}.muted{color:#687782}.hidden{display:none}.tabs button{margin:3px;background:#fff;color:#17324d;border:1px solid #ddd}.tabs button.on{background:#079447;color:#fff}.danger{color:#b32626}.small{font-size:12px}</style></head><body><header><div><b>সবুজ কম্পিউটার্স</b><div class="small">Smart Work Desk • Cloud</div></div><button id="logout" class="red hidden">Logout</button></header><main><section id="auth" class="card"><h2>Cloud Login</h2><p class="muted">নিজের account দিয়ে Login/Signup করুন।</p><input id="email" type="email" placeholder="Email"><input id="pass" type="password" placeholder="Password"><button onclick="login()">Login</button> <button onclick="signup()">Signup</button><p id="msg"></p></section><section id="app" class="hidden"><div class="card"><div class="tabs"><button class="on" onclick="tab('tasks',this)">✅ কাজ</button><button onclick="tab('prompts',this)">⚡ Prompt</button><button onclick="tab('notes',this)">📝 নোট</button><button onclick="tab('customers',this)">👥 Customer</button><button onclick="tab('dues',this)">💰 বাকি</button></div></div><div id="panel" class="card"></div></section></main><script>const URL='https://usbfqolkrkjugwscvulu.supabase.co',KEY='sb_publishable_UfkOQ5ygV_AEtNdC3Txmng_PTvk-N84';const db=supabase.createClient(URL,KEY);let user=null,kind='tasks',items=[];const $=id=>document.getElementById(id);async function boot(){const r=await db.auth.getSession();user=r.data.session?.user||null;renderAuth();db.auth.onAuthStateChange((e,s)=>{user=s?.user||null;renderAuth()})}function renderAuth(){if(user){$('auth').classList.add('hidden');$('app').classList.remove('hidden');$('logout').classList.remove('hidden');load()}else{$('auth').classList.remove('hidden');$('app').classList.add('hidden');$('logout').classList.add('hidden')}}async function login(){const r=await db.auth.signInWithPassword({email:$('email').value,password:$('pass').value});$('msg').textContent=r.error?r.error.message:'Login successful';}async function signup(){const r=await db.auth.signUp({email:$('email').value,password:$('pass').value});$('msg').textContent=r.error?r.error.message:'Signup successful. Email verification may be required.'} $('logout').onclick=()=>db.auth.signOut();function tab(k,b){kind=k;document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('on'));b.classList.add('on');draw()}async function load(){const r=await db.from('workdesk_items').select('*').order('updated_at',{ascending:false});if(r.error){$('panel').innerHTML='<p class="danger">'+r.error.message+'</p>';return}items=r.data||[];draw()}function draw(){const names={tasks:'দৈনিক কাজ',prompts:'Prompt Library',notes:'নোটস',customers:'কাস্টমার',dues:'বাকির হিসাব'};const list=items.filter(x=>x.item_type===kind);$('panel').innerHTML='<h2>'+names[kind]+'</h2><div class="grid"><div><input id="search" placeholder="🔍 খুঁজুন..." oninput="drawList()"><div id="list"></div></div><div><h3>নতুন যোগ করুন</h3><input id="title" placeholder="শিরোনাম / নাম"><input id="extra" placeholder="ফোন / টাকা / ক্যাটাগরি"><textarea id="body" placeholder="বিস্তারিত লিখুন..."></textarea><button onclick="add()">＋ Save to Cloud</button></div></div>';drawList()}function drawList(){const q=($('search')?.value||'').toLowerCase();const list=items.filter(x=>x.item_type===kind&&JSON.stringify(x.data).toLowerCase().includes(q));$('list').innerHTML=list.map(x=>'<div class="item"><b>'+esc(x.data.title||'Untitled')+'</b><div>'+esc(x.data.extra||'')+'</div><div class="muted">'+esc(x.data.body||'')+'</div><button class="red" onclick="del(\''+x.id+'\')">Delete</button></div>').join('')||'<p class="muted">কোনো data নেই।</p>'}async function add(){const title=$('title').value.trim();if(!title)return alert('শিরোনাম/নাম দিন');const r=await db.from('workdesk_items').insert({owner_id:user.id,item_type:kind,data:{title,extra:$('extra').value,body:$('body').value}});if(r.error)alert(r.error.message);else{await load();}}async function del(id){if(!confirm('Delete করবেন?'))return;const r=await db.from('workdesk_items').delete().eq('id',id);if(r.error)alert(r.error.message);else load()}function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}boot();</script></body></html>
